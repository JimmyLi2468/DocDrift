# Production-stack services for DocDrift, local only. The API itself runs natively
# (uvicorn), next to the PDF library, and Ollama runs natively too: on Apple silicon
# only a native Ollama can use the GPU.
#
#   docker compose up -d                          # start the three databases
#   PYTHONPATH=. python scripts/load_production.py
#   PYTHONPATH=. python scripts/check_production.py
#   DOCDRIFT_STACK=production uvicorn docdrift.api:app --port 8000
#
# Credentials are for a local demo. The API uses the read-only ones.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docdrift_admin
      POSTGRES_DB: docdrift
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docdrift"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__API_KEY: docdrift-write            # loader
      QDRANT__SERVICE__READ_ONLY_API_KEY: docdrift-read   # API: search only
      QDRANT__TELEMETRY_DISABLED: "true"
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/docdrift1
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4jdata:/data"]

volumes: { pgdata: {}, qdrantdata: {}, neo4jdata: {} }
