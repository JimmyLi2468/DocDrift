[project]
name = "docdrift"
version = "0.3.0"
description = "Local, read-only maintenance intelligence with documentation-drift detection and explicit change governance"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ingest = ["pymupdf>=1.24"]
history = ["reportlab>=4.1"]
embeddings = ["sentence-transformers>=3.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
production = ["psycopg[binary]>=3.1", "qdrant-client>=1.9", "neo4j>=5.19"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
docdrift = "docdrift.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docdrift*"]

[tool.setuptools.package-data]
docdrift = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
